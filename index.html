  <style>
    @font-face {
      font-family: "Saans";
      src: url("/assets/font/Saans-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #fafafa;
      --fg: #161616;
      --accent: #9b8afb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Saans", system-ui, sans-serif;
      font-weight: 500;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 24px;
      padding: clamp(20px, 3vw, 40px);
    }

    h1 {
      align-self: center;
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      margin: 0 auto;
      font-size: clamp(56px, 13vw, 240px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.06em;
      white-space: nowrap;
    }

    h1 span,
    h1 .pfp {
      flex-shrink: 0;
    }

    .pfp {
      display: block;
      width: clamp(70px, 0.78em, 190px);
      font: inherit;
      aspect-ratio: 1;
      margin: 0 0.05em 0 0.16em;
      padding: 0;
      border: 0;
      border-radius: 50%;
      overflow: hidden;
      background: var(--pfp-bg, #9b8cf8);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background-color 0.45s ease, transform 0.18s ease;
    }

    .pfp:hover {
      transform: scale(1.02);
    }

    .pfp:active {
      transform: scale(0.96);
    }

    .pfp:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 4px;
    }

    .pfp object,
    .pfp-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      pointer-events: none;
    }

    .bio {
      max-width: 30ch;
      font-size: clamp(20px, 1.9vw, 30px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .bio a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .bio a:hover {
      color: var(--fg);
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: clamp(8px, 2vh, 24px);

  <script>
    (function () {
      var palettes = [
        { name: "Lilac", color: "#9b8cf8" },
        { name: "Marigold", color: "#f6c453" },
        { name: "Sky", color: "#7ec8e3" },
        { name: "Coral", color: "#f4978e" },
        { name: "Sage", color: "#a8d5a2" },
        { name: "Lavender", color: "#c9b6f2" },
        { name: "Pink", color: "#f9a8d4" },
        { name: "Peach", color: "#f4b183" },
        { name: "Mint", color: "#8fd9c4" },
        { name: "Butter", color: "#f7e38c" },
        { name: "Periwinkle", color: "#a5b4fc" },
        { name: "Apricot", color: "#f9c598" },
        { name: "Cherry", color: "#f28b82" },
        { name: "Pistachio", color: "#cbe7a5" },
        { name: "Blueberry", color: "#93a7f5" },
        { name: "Rose", color: "#f5b8c4" }
      ];
      var storageKey = "pfp-palette";
      var button = document.getElementById("pfp-toggle");
      if (!button) return;

      var art = button.querySelector("object");
      var index = 0;

      try {
        var saved = parseInt(localStorage.getItem(storageKey), 10);
        if (!isNaN(saved) && saved >= 0 && saved < palettes.length) index = saved;
      } catch (e) { }

      function getBackgroundPath() {
        var doc = art.contentDocument;
        if (!doc) return null;
        return doc.getElementById("pfp-bg") || doc.querySelector('path[fill="#9b8cf8"]');
      }

      function paint(animate) {
        var palette = palettes[index];
        button.style.setProperty("--pfp-bg", palette.color);
        button.setAttribute("aria-label", "Dev Chauhan - change profile background color. Current: " + palette.name);
        button.title = "Background: " + palette.name;

        var path = getBackgroundPath();
        if (path) {
          if (animate) path.style.transition = "fill 450ms ease";
          path.setAttribute("fill", palette.color);
        }
      }

      art.addEventListener("load", function () {
        paint(false);
      });

      button.addEventListener("click", function () {
        index = (index + 1) % palettes.length;
        paint(true);
        try {
          localStorage.setItem(storageKey, String(index));
        } catch (e) { }
      });

      paint(false);
    })();
  </script>
